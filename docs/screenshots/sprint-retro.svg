<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Sprint Room retro board</title><desc id="desc">Sprint retro board with private cards and facilitator reveal workflow.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eff7ee"/><stop offset="0.5" stop-color="#f6f1e8"/><stop offset="1" stop-color="#fff4ee"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1c231e" flood-opacity="0.12"/></filter></defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g transform="translate(110 80)" font-family="Inter, Arial, sans-serif"><text x="0" y="0" fill="#17604a" font-size="16" font-weight="900">SPRINT ROOM</text><text x="0" y="82" fill="#17211b" font-size="72" font-weight="900">Sprint retro</text><rect x="840" y="0" width="130" height="44" rx="8" fill="#2f8f6f"/><text x="866" y="28" fill="#fff" font-size="16" font-weight="900">Reveal board</text><rect x="986" y="0" width="110" height="44" rx="8" fill="#edf4ef" stroke="#dbe2dc"/><text x="1016" y="28" fill="#17211b" font-size="16" font-weight="900">Copy link</text><rect x="0" y="118" width="1220" height="52" rx="8" fill="#fce6de" stroke="#e7b7a8"/><text x="22" y="151" fill="#823621" font-size="17" font-weight="900">Cards are private while the team submits feedback. The facilitator can reveal the board when discussion starts.</text></g>
  <g transform="translate(110 220)" filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <g><rect width="386" height="560" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="24" y="44" fill="#17211b" font-size="24" font-weight="900">Went well</text><rect x="24" y="82" width="338" height="92" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="42" y="116" fill="#17211b" font-size="17" font-weight="700">Deployment was smooth and</text><text x="42" y="140" fill="#17211b" font-size="17" font-weight="700">release notes were clear.</text><text x="42" y="160" fill="#637067" font-size="13" font-weight="900">Satya</text><rect x="24" y="430" width="338" height="86" rx="8" fill="#fffdf8" stroke="#dbe2dc"/><text x="42" y="462" fill="#637067" font-size="16" font-weight="700">Add a note</text><rect x="24" y="528" width="76" height="44" rx="8" fill="#2f8f6f"/><text x="49" y="556" fill="#fff" font-size="16" font-weight="900">Add</text></g>
    <g transform="translate(417 0)"><rect width="386" height="560" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="24" y="44" fill="#17211b" font-size="24" font-weight="900">Could be better</text><rect x="24" y="82" width="338" height="116" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="42" y="116" fill="#17211b" font-size="17" font-weight="700">Refinement should start earlier</text><text x="42" y="140" fill="#17211b" font-size="17" font-weight="700">so QA can review acceptance</text><text x="42" y="164" fill="#17211b" font-size="17" font-weight="700">criteria before planning.</text><text x="42" y="184" fill="#637067" font-size="13" font-weight="900">Swati</text><rect x="24" y="430" width="338" height="86" rx="8" fill="#fffdf8" stroke="#dbe2dc"/><text x="42" y="462" fill="#637067" font-size="16" font-weight="700">Add a note</text><rect x="24" y="528" width="76" height="44" rx="8" fill="#2f8f6f"/><text x="49" y="556" fill="#fff" font-size="16" font-weight="900">Add</text></g>
    <g transform="translate(834 0)"><rect width="386" height="560" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="24" y="44" fill="#17211b" font-size="24" font-weight="900">Feedback</text><rect x="24" y="82" width="338" height="92" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="42" y="116" fill="#17211b" font-size="17" font-weight="700">Keep demos shorter and leave</text><text x="42" y="140" fill="#17211b" font-size="17" font-weight="700">more room for questions.</text><text x="42" y="160" fill="#637067" font-size="13" font-weight="900">Priya</text><rect x="24" y="430" width="338" height="86" rx="8" fill="#fffdf8" stroke="#dbe2dc"/><text x="42" y="462" fill="#637067" font-size="16" font-weight="700">Add a note</text><rect x="24" y="528" width="76" height="44" rx="8" fill="#2f8f6f"/><text x="49" y="556" fill="#fff" font-size="16" font-weight="900">Add</text></g>
  </g>
</svg>
