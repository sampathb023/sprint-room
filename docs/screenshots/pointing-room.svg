<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Sprint Room pointing room</title><desc id="desc">Pointing session with story list, estimate cards, average, vote spread, and participants.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#eff7ee"/><stop offset="0.5" stop-color="#f6f1e8"/><stop offset="1" stop-color="#fff4ee"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1c231e" flood-opacity="0.12"/></filter></defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <g transform="translate(110 70)" font-family="Inter, Arial, sans-serif"><text x="0" y="0" fill="#17604a" font-size="16" font-weight="900">SPRINT ROOM</text><text x="0" y="78" fill="#17211b" font-size="64" font-weight="900">Checkout flow cleanup</text><rect x="0" y="112" width="720" height="86" rx="8" fill="#fffdf8" stroke="#dbe2dc"/><text x="20" y="148" fill="#637067" font-size="18" font-weight="700">Refactor payment validation and error handling before release.</text><rect x="950" y="0" width="110" height="44" rx="8" fill="#edf4ef" stroke="#dbe2dc"/><text x="980" y="28" fill="#17211b" font-size="16" font-weight="900">Copy link</text><rect x="1075" y="0" width="130" height="44" rx="8" fill="#edf4ef" stroke="#dbe2dc"/><text x="1101" y="28" fill="#17211b" font-size="16" font-weight="900">New session</text></g>
  <g transform="translate(110 250)" font-family="Inter, Arial, sans-serif">
    <g filter="url(#shadow)"><rect width="270" height="360" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="22" y="42" fill="#17211b" font-size="20" font-weight="900">Stories</text><text x="238" y="42" fill="#637067" font-size="18" font-weight="900">3</text><rect x="22" y="78" width="226" height="70" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="38" y="112" fill="#17211b" font-size="18" font-weight="900">Login polish</text><text x="38" y="136" fill="#637067" font-size="14" font-weight="900">Pointed 3</text><rect x="22" y="160" width="226" height="70" rx="8" fill="#edf4ef" stroke="#2f8f6f"/><text x="38" y="194" fill="#17211b" font-size="18" font-weight="900">Checkout flow</text><text x="38" y="218" fill="#637067" font-size="14" font-weight="900">Estimating now</text><rect x="22" y="242" width="226" height="70" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="38" y="276" fill="#17211b" font-size="18" font-weight="900">Audit logging</text><text x="38" y="300" fill="#637067" font-size="14" font-weight="900">Ready</text></g>
    <g transform="translate(292 0)" filter="url(#shadow)"><rect width="610" height="360" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="26" y="42" fill="#17211b" font-size="20" font-weight="900">Pick your estimate</text><text x="548" y="42" fill="#637067" font-size="16" font-weight="900">Live</text><g font-size="40" font-weight="900" text-anchor="middle"><rect x="26" y="72" width="104" height="104" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="78" y="136" fill="#17211b">0</text><rect x="146" y="72" width="104" height="104" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="198" y="136" fill="#17211b">1</text><rect x="266" y="72" width="104" height="104" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="318" y="136" fill="#17211b">2</text><rect x="386" y="72" width="104" height="104" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="438" y="136" fill="#17211b">3</text><rect x="26" y="192" width="104" height="104" rx="8" fill="#e56b4f"/><text x="78" y="256" fill="#fff">5</text><rect x="146" y="192" width="104" height="104" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="198" y="256" fill="#17211b">8</text><rect x="266" y="192" width="104" height="104" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="318" y="256" fill="#17211b">13</text><rect x="386" y="192" width="104" height="104" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="438" y="256" fill="#17211b">21</text><rect x="506" y="192" width="78" height="104" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="545" y="256" fill="#17211b">?</text></g></g>
    <g transform="translate(924 0)" filter="url(#shadow)"><rect width="300" height="360" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="24" y="42" fill="#637067" font-size="18" font-weight="900">Team average</text><text x="24" y="102" fill="#17211b" font-size="54" font-weight="900">4.0</text><text x="24" y="150" fill="#637067" font-size="18" font-weight="900">Vote spread</text><rect x="24" y="170" width="252" height="42" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="42" y="197" fill="#17211b" font-size="18" font-weight="900">2</text><text x="202" y="197" fill="#637067" font-size="14" font-weight="900">1 vote</text><rect x="24" y="222" width="252" height="42" rx="8" fill="#fbfaf6" stroke="#dbe2dc"/><text x="42" y="249" fill="#17211b" font-size="18" font-weight="900">5</text><text x="196" y="249" fill="#637067" font-size="14" font-weight="900">2 votes</text></g>
  </g>
  <g transform="translate(402 660)" font-family="Inter, Arial, sans-serif"><text x="0" y="0" fill="#17211b" font-size="22" font-weight="900">Team</text><text x="720" y="0" fill="#637067" font-size="16" font-weight="900">3 of 3 voted</text><rect y="28" width="165" height="78" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="18" y="62" fill="#17211b" font-size="16" font-weight="900">Satya</text><text x="18" y="90" fill="#17604a" font-size="14" font-weight="900">2</text><rect x="178" y="28" width="165" height="78" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="196" y="62" fill="#17211b" font-size="16" font-weight="900">Swati</text><text x="196" y="90" fill="#17604a" font-size="14" font-weight="900">5</text><rect x="356" y="28" width="165" height="78" rx="8" fill="#fff" stroke="#dbe2dc"/><text x="374" y="62" fill="#17211b" font-size="16" font-weight="900">Priya</text><text x="374" y="90" fill="#17604a" font-size="14" font-weight="900">5</text></g>
</svg>
